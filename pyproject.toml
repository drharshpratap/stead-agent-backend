[project]
name = "stead-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "drharshpratap", email = "dr.harshpratap@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "livekit-agents[google,sarvam,silero]~=1.8",
    "livekit-api>=1.2.2",
    "llama-index>=0.10.68",
    "llama-index-embeddings-huggingface>=0.2.3",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
stead-agent = "stead_agent:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
